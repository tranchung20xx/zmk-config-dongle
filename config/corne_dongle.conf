CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y

CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=2
CONFIG_ZMK_SPLIT_ESB_AUTO_HEAL_KEY_POS_MAX=42

CONFIG_ZMK_SPLIT_ESB_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
CONFIG_ZMK_SPLIT_ESB_MSG_POSTFIX_CRC=y

# Lock to clean RF channel 76 (2476 MHz, above Wi-Fi Ch 11 and below BLE Ch 39)
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP=n
CONFIG_ZMK_SPLIT_ESB_DEFAULT_RF_CHANNEL=76
CONFIG_ZMK_SPLIT_ESB_PROTO_MSGQ_ITEMS=128
CONFIG_ZMK_SPLIT_ESB_EVENT_BUFFER_ITEMS=128
CONFIG_ZMK_SPLIT_ESB_CMD_BUFFER_ITEMS=32

CONFIG_ESB_MAX_PAYLOAD_LENGTH=64
CONFIG_ESB_TX_FIFO_SIZE=1

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=256

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
