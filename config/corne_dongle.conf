CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y

CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=48
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48

CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_BOOT=n
CONFIG_ZMK_SLEEP=n

CONFIG_ZMK_SPLIT_ESB_RX_QUEUE_SIZE=64
CONFIG_ZMK_SPLIT_ESB_EVENT_QUEUE_SIZE=64
CONFIG_ESB_RX_FIFO_SIZE=32
CONFIG_ESB_TX_FIFO_SIZE=16

CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

CONFIG_LOG=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=n
