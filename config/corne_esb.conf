CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y

CONFIG_ZMK_SPLIT_ESB_MAX_PAYLOAD=48
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48

CONFIG_ESB_TX_FIFO_SIZE=32
CONFIG_ZMK_SPLIT_ESB_COMMAND_QUEUE_SIZE=32

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=n

CONFIG_LOG=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=n
